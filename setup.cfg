# The ONE thing that cannot be said in pyproject.toml: where setuptools stages
# its working copy of the package.
#
# A generated directory is named `_something` in this repository (see
# .gitignore), and `build/` is setuptools' hardcoded default — a full duplicate
# of the source tree, refreshed by any `pip wheel .` or `python -m build`, and
# committed by accident once. `build_base` is a distutils command option, so it
# has no `[tool.setuptools]` spelling; setup.cfg is where a command default
# lives, and this file exists for that line alone.
#
# `media_compost.egg-info` deliberately keeps its name and its place: setuptools
# derives it from the distribution name, and moving it with `egg_base` needs the
# target directory to already exist — which is a way to break `pip install -e .`,
# the documented install, for a cosmetic gain.
[build]
build_base = _build
