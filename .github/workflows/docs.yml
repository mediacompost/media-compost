# Publishes the website (website/mkdocs.yml + docs/) to GitHub Pages.
#
# ONE SITE, AT THE ROOT. It was `mike`, which keeps a
# directory per minor series in a `gh-pages` branch and a switcher over
# them, so the address carried a version (`/1.0/`), `latest` was an alias
# somebody might be reading instead, and `/dev/` was a fourth answer to the
# same question. What the site is for is the version people can install, and
# there is one of those — so each deploy publishes the whole site at the ROOT
# and every link into the documentation is a link to the current
# documentation.
#
# PAGES IS SET TO "GitHub Actions", NOT "Deploy from a branch" (2026-09).
# The site is built in the runner, handed over as an artifact
# (`upload-pages-artifact`) and published by `deploy-pages`; nothing is
# committed anywhere, and the `gh-pages` branch `mkdocs gh-deploy` used to
# rewrite has no reader any more. The repository's Settings -> Pages -> Source
# has to say GitHub Actions, or the deploy step is refused.
#
# A CUSTOM DOMAIN is a setting in that same place and nothing else: with no
# branch there is no `CNAME` file to lose, and none belongs in `docs/`.
# `site_url` in `website/mkdocs.yml` has to move with it.
#
# THE `github-pages` ENVIRONMENT GUARDS THE DEPLOY, and by default it takes
# only the default branch. Both ways in pass it: publish.yml is started by
# hand from `main`, and so is a dispatched run here — the tag is what is
# CHECKED OUT, never the ref the run belongs to. Adding a trigger that runs on
# a tag means adding the tag pattern to that environment's rules.
#
# IT RUNS FROM A TAG, ALWAYS. `publish.yml` calls it with the tag it has just
# published, and a hand-started run takes one too: a documentation fix for the
# release that is out, without a release to carry it. There is no build from a
# branch, because the site would then describe code nobody can install —
# `mkdocs serve` is how unreleased prose is read (see `SETUP.md`).
#
# RELEASES ONLY. This used to run on every push to main, which
# republished the whole site for a typo in a docstring and put a second job in
# the queue behind every commit.
#
# PUBLISH.YML CALLS THIS ONE — it is not watching for anything of its own.
# `workflow_call` is what makes a site that only ever describes a version
# somebody can install: the calling job says `needs: publish`, so a wheel PyPI
# refused never gets documentation claiming otherwise. On a tag of its own
# this would fire beside the upload rather than after it, and there is no
# `release: published` to wait for either, since publish.yml creates that
# release with GITHUB_TOKEN and a token-made release raises no event another
# workflow can see.
#
# The tag is an INPUT rather than something read off the context: publish.yml
# is started by hand, so its `github.ref` is whatever branch the run was
# launched from and never the tag.
name: Docs

# Otherwise every run is "Docs" on "main": a dispatched run belongs to the
# branch it was started from rather than to the tag it is about.
run-name: Docs ${{ inputs.ref }}

on:
  workflow_call:
    inputs:
      ref:
        description: "The release tag to build and publish"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: "The release tag to publish again, e.g. v1.2.3"
        required: true
        type: string

# The Pages deploy token, not write access to the repository: `id-token` is
# what `deploy-pages` proves the run's identity with. publish.yml has to grant
# the same three, since a called workflow gets no more than its caller gives.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r website/requirements.txt

      # `--strict` turns a broken cross-link or a page missing from the nav
      # into a failed build, and nothing is uploaded when it fails.
      # `site_dir` is relative to the config, so the site lands in
      # `website/_build` — the same scratch folder a local build writes.
      - name: Build the site strictly
        run: mkdocs build --strict -f website/mkdocs.yml

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/_build

      - name: Publish it to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
