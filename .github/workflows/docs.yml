# Publishes the website (website/mkdocs.yml + docs/) to GitHub Pages.
#
# ONE SITE, AT THE ROOT. It was `mike`, which keeps a
# directory per minor series in the `gh-pages` branch and a switcher over
# them, so the address carried a version (`/1.0/`), `latest` was an alias
# somebody might be reading instead, and `/dev/` was a fourth answer to the
# same question. What the site is for is the version people can install, and
# there is one of those — so `mkdocs gh-deploy` now writes the built site to
# the branch ROOT and every link into the documentation is a link to the
# current documentation.
#
# THE FIRST RUN OF THIS REPLACES THE BRANCH: gh-deploy commits the site it
# just built as the whole tree, where mike only ever touched the directories
# it owned. `/1.0/`, `/latest/`, `/dev/` and `versions.json` stop answering
# the moment it lands. That is the change, not a side effect of it, but it is
# worth knowing before pressing the button.
#
# Pages stays on "Deploy from a branch → gh-pages / (root)" — the same
# setting mike needed, so there is nothing to change there.
#
# A CUSTOM DOMAIN is one more setting in the same place, and `site_url` in
# `website/mkdocs.yml` has to move with it. That setting writes `CNAME` to the
# branch root, and THIS DEPLOY WOULD THEN REMOVE IT on its next run: with the
# whole root replaced, a `CNAME` has to be part of the build, which now means
# a file in `docs/` (under mike that landed inside a version directory and was
# useless; `docs_dir` is the site root now).
#
# IT RUNS FROM A TAG, ALWAYS. `publish.yml` calls it with the tag it has just
# published, and a hand-started run takes one too: a documentation fix for the
# release that is out, without a release to carry it. There is no build from a
# branch, because the site would then describe code nobody can install —
# `mkdocs serve` is how unreleased prose is read (see `SETUP.md`).
#
# RELEASES ONLY. This used to run on every push to main, which
# republished the whole site for a typo in a docstring and put a second job in
# the queue behind every commit.
#
# PUBLISH.YML CALLS THIS ONE — it is not watching for anything of its own.
# `workflow_call` is what makes a site that only ever describes a version
# somebody can install: the calling job says `needs: publish`, so a wheel PyPI
# refused never gets documentation claiming otherwise. On a tag of its own
# this would fire beside the upload rather than after it, and there is no
# `release: published` to wait for either, since publish.yml creates that
# release with GITHUB_TOKEN and a token-made release raises no event another
# workflow can see.
#
# The tag is an INPUT rather than something read off the context: publish.yml
# is started by hand, so its `github.ref` is whatever branch the run was
# launched from and never the tag.
name: Docs

# Otherwise every run is "Docs" on "main": a dispatched run belongs to the
# branch it was started from rather than to the tag it is about.
run-name: Docs ${{ inputs.ref }}

on:
  workflow_call:
    inputs:
      ref:
        description: "The release tag to build and publish"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: "The release tag to publish again, e.g. v1.2.3"
        required: true
        type: string

# `gh-deploy` pushes the built site to gh-pages, so this needs write access to
# the repository rather than the Pages deploy token.
permissions:
  contents: write

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gh-deploy appends a commit to gh-pages, which a shallow clone has
          # neither of.
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r website/requirements.txt

      # ghp-import (inside gh-deploy) makes a real commit, and git refuses to
      # write one from a runner with nobody configured.
      - name: Identify as the bot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ONE COMMAND, AND IT BUILDS BEFORE IT PUSHES: `--strict` turns a broken
      # cross-link or a page missing from the nav into a failed build, and
      # nothing reaches the branch when it fails. It was a separate `mkdocs
      # build --strict` gate ahead of `mike deploy`, which built the site
      # twice to say the same thing.
      - name: Build the site strictly and publish it to gh-pages
        env:
          TAG: ${{ inputs.ref }}
        # The message NAMES THE TAG — `gh-pages` is otherwise a list of
        # identical subjects and nothing on the branch says which release the
        # site describes — and KEEPS MkDocs' own suffix: the next deploy reads
        # its version back out of that line to refuse an older MkDocs writing
        # over a newer one's output, and a message it cannot parse quietly
        # drops the check.
        run: |
          mkdocs gh-deploy --strict -f website/mkdocs.yml \
            --message "Docs for $TAG — Deployed {sha} with MkDocs version: {version}"
