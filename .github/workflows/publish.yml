# Upload a drafted release to PyPI and publish it. STARTED BY HAND —
# Actions -> Publish -> Run workflow, with the tag as its input.
#
# This is the half that cannot be undone: PyPI does not let a version be
# replaced or re-uploaded, and a published release is immutable. Everything
# `draft.yml` did before it is disposable, which is why the split falls here
# and why this workflow has no trigger of its own. A manual run needs write
# access to the repository and nothing else — no reviewers to nominate, no
# environment rule anybody has to remember to add.
#
# It takes the files OFF THE DRAFT rather than rebuilding them or fetching a
# build artifact. The wheel somebody downloaded and tested is then the wheel
# PyPI receives, as a matter of where the bytes came from rather than of the
# plumbing being right.
#
# Trusted publishing: no API token anywhere. On pypi.org the project names
# this repository (mediacompost/media-compost), THIS FILE (publish.yml) and
# the environment (pypi) as its publisher, and `id-token: write` is what lets
# the job prove it is that workflow. Renaming this file breaks the upload
# with an error about the publisher, so the tag half is `draft.yml`.

name: Release Publish

# The list otherwise shows every one of these as "Release Publish" on "main":
# a dispatched run belongs to the branch it was started from rather than to
# the tag it is about.
run-name: Publish ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to publish, e.g. v1.2.3"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-26.04
    environment:
      name: pypi
      url: https://pypi.org/project/media-compost/
    permissions:
      id-token: write
      # WRITE, to READ. A draft release is only listed to a caller with push
      # access, so `contents: read` gets a 404 and `gh` says "release not
      # found" — which reads as a missing draft rather than as a token that
      # cannot see one.
      contents: write
    steps:
      - name: Take the files off the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        # Three answers, and they are not the same problem: no release at all
        # (the tag was never drafted, or the draft was deleted), a published
        # one (this version has been through already, and PyPI would refuse
        # the upload anyway), or a draft, which is the one to take.
        run: |
          draft=$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft 2>&1) || {
            echo "::error::no release for $TAG: $draft"
            exit 1
          }
          if [ "$draft" != "true" ]; then
            echo "::error::$TAG is not a draft release — it has been published already"
            exit 1
          fi
          mkdir -p _dist
          gh release download "$TAG" --repo "$REPO" --dir _dist \
            --pattern "*.whl" --pattern "*.tar.gz"
          ls -l _dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: _dist

  # The draft becomes a release, with the files already on it — after which
  # nothing can be attached to it ever again.
  release:
    needs: publish
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Publish it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --draft=false --repo "${{ github.repository }}"

  # The site, only for a version that reached the index. It hangs off the
  # UPLOAD rather than off the release job beside it: PyPI is what somebody
  # installs from, and a hiccup writing the GitHub release should not leave
  # the documentation a version behind.
  docs:
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      ref: ${{ inputs.tag }}
